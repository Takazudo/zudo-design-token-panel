# Cloudflare Workers Static Assets configuration for the full playground demo.
# The playground is a prerendered zfb site, so it has no worker entrypoint.

name = "zdtp-playground"
compatibility_date = "2026-09-05"

# Serve production from the custom domain while retaining version preview URLs
# for PR validation. These keys must remain above the [assets] table because
# TOML scopes later keys to the current table.
preview_urls = true
workers_dev = false

[assets]
directory = "./dist"

[[routes]]
pattern = "zdtp-playground.takazudomodular.com"
custom_domain = true
