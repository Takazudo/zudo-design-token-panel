name: Consumer drift re-exam

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: consumer-drift
  cancel-in-progress: false

jobs:
  zudo-doc-manifest:
    name: Latest zudo-doc manifest contract
    runs-on: ubuntu-24.04 # Playwright 1.60 has no Chromium for ubuntu-latest (26.04)
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # The job tracks the latest zudo-doc, so it must run on the Node range
      # that release declares (zudo-doc 7.0.0 moved to ">=24 <25"); otherwise an
      # upstream engine bump fails the install and masquerades as manifest drift.
      - name: Resolve the latest zudo-doc version and Node engine
        id: zudo-doc
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view @takazudo/zudo-doc@latest version)"
          range="$(npm view "@takazudo/zudo-doc@${version}" engines.node)"
          echo "zudo-doc ${version} engines.node: ${range:-<none>}"
          history_range="$(npm view "@takazudo/zudo-doc-history-server@${version}" engines.node 2>/dev/null || echo '<unpublished>')"
          echo "history-server ${version} engines.node: ${history_range:-<none>}"
          echo "zudo-doc ${version} peerDependencies:"
          npm view "@takazudo/zudo-doc@${version}" peerDependencies

          unbounded_re='^(>=?)[[:space:]]*v?([0-9]+)'
          if [ -z "$range" ] || [ "$range" = "undefined" ]; then
            range=22
          elif [[ "$range" != *"<"* && "$range" != *"||"* && "$range" =~ $unbounded_re ]]; then
            # Unbounded (">=24"): pin the lowest admitted major instead of the newest Node.
            major="${BASH_REMATCH[2]}"
            if [ "${BASH_REMATCH[1]}" = ">" ]; then major=$((major + 1)); fi
            range="$major"
          fi
          echo "Resolved Node range: ${range}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "node-range=${range}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ steps.zudo-doc.outputs.node-range }}

      - name: Record the installed Node version
        id: node
        run: |
          node -v
          echo "version=$(node -v)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the manifest contract
        run: pnpm --filter @takazudo/zdtp exec playwright install --with-deps chromium

      - name: Install the resolved zudo-doc family in the disposable checkout
        shell: bash
        env:
          ZUDO_DOC_VERSION: ${{ steps.zudo-doc.outputs.version }}
        run: |
          set -euo pipefail
          # zudo-doc and its history server release in lockstep and zudo-doc peers
          # the same major, so install both at the one resolved version.
          if [ -n "$(npm view "@takazudo/zudo-doc-history-server@${ZUDO_DOC_VERSION}" version 2>/dev/null)" ]; then
            pnpm --filter doc update "@takazudo/zudo-doc@${ZUDO_DOC_VERSION}" "@takazudo/zudo-doc-history-server@${ZUDO_DOC_VERSION}"
          else
            echo "history-server@${ZUDO_DOC_VERSION} missing; using --latest for it"
            pnpm --filter doc update "@takazudo/zudo-doc@${ZUDO_DOC_VERSION}"
            pnpm --filter doc update @takazudo/zudo-doc-history-server --latest
          fi

      - name: Re-vendor the latest zudo-doc manifest
        run: node scripts/vendor-consumer-manifest.mjs

      # `exec vitest` with a path filter runs only this file; `test:browser -- <file>`
      # forwarded the `--` and ran the whole browser project.
      - name: Run the consumer-manifest contract test
        run: pnpm --filter @takazudo/zdtp exec vitest run --project browser src/__tests__/consumer-manifest.browser.test.tsx

      - name: Open or update the manifest drift issue
        if: ${{ failure() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DRIFT_MARKER: '<!-- consumer-drift:zudo-doc-manifest -->'
          ZUDO_DOC_VERSION: ${{ steps.zudo-doc.outputs.version }}
          NODE_RANGE: ${{ steps.zudo-doc.outputs.node-range }}
          NODE_VERSION: ${{ steps.node.outputs.version }}
        with:
          script: |
            const marker = process.env.DRIFT_MARKER;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const title = 'Consumer drift: latest zudo-doc manifest contract failed';
            const body = `${marker}
            ## Latest zudo-doc manifest drift

            The weekly consumer-manifest contract check failed after installing the latest \`@takazudo/zudo-doc\`.

            - Run: ${runUrl}
            - Commit: \`${context.sha}\`
            - zudo-doc: \`${process.env.ZUDO_DOC_VERSION || 'unresolved'}\`
            - Node range: \`${process.env.NODE_RANGE || 'unresolved'}\`, installed: \`${process.env.NODE_VERSION || 'not installed'}\`

            Check the failing step before treating this as manifest drift: an install or engine failure stops the job before the contract test runs.

            This issue is deduplicated by the marker above and will be updated by the next failed run.`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${marker}"`,
            });
            const existing = search.data.items.find((item) => item.body?.includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              console.log(`Updated existing drift issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              console.log(`Created drift issue #${created.data.number}`);
            }

  cross-example:
    name: Cross-example (${{ matrix.example }})
    # As of 2026-11-07 all five public examples pin the published 0.9.1, so this
    # matrix runs on the weekly schedule (and on dispatch) and blocks: each leg
    # builds one example against this commit's packed panel. It is not a
    # required check on ordinary panel PRs; per-example Apply CI stays in the
    # example repositories.
    runs-on: ubuntu-24.04 # Playwright 1.60 has no Chromium for ubuntu-latest (26.04)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example:
          - astro
          - vite-react
          - nextjs
          - zfb
          - zfb-tailwind
    steps:
      - name: Checkout panel repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install panel repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the consumer probe
        run: pnpm --filter @takazudo/zdtp exec playwright install --with-deps chromium

      - name: Build and pack the panel from this commit
        id: panel
        shell: bash
        run: |
          set -euo pipefail
          panel_pack_dir="$RUNNER_TEMP/zdtp-panel"
          mkdir -p "$panel_pack_dir"
          pnpm --filter @takazudo/zdtp build
          pnpm --filter @takazudo/zdtp pack --pack-destination "$panel_pack_dir"
          panel_tarball="$(find "$panel_pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$panel_tarball" ]; then
            echo "The panel pack command did not produce a tarball" >&2
            exit 1
          fi

          extract_dir="$RUNNER_TEMP/zdtp-panel-extract"
          mkdir -p "$extract_dir"
          tar -xzf "$panel_tarball" -C "$extract_dir"
          panel_version="$(node -p 'require(process.argv[1]).version' "$extract_dir/package/package.json")"
          dist_hash="$(cd "$extract_dir/package/dist" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "Packed @takazudo/zdtp ${panel_version}, dist sha256 ${dist_hash}"
          {
            echo "tarball=$panel_tarball"
            echo "version=$panel_version"
            echo "dist-hash=$dist_hash"
          } >> "$GITHUB_OUTPUT"

      - name: Clone the public consumer example
        env:
          EXAMPLE: ${{ matrix.example }}
        run: git clone --depth=1 "https://github.com/Takazudo/zudo-design-token-panel-example-${EXAMPLE}.git" "$RUNNER_TEMP/example"

      # A direct dependency rewrite works the same under the pnpm version each
      # example pins; the install step below proves which bytes were resolved.
      - name: Point the disposable consumer at the packed panel
        env:
          EXAMPLE_PACKAGE_JSON: ${{ runner.temp }}/example/package.json
          LOCAL_PANEL_TARBALL: ${{ steps.panel.outputs.tarball }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const packageJsonPath = process.env.EXAMPLE_PACKAGE_JSON;
          const panelTarball = process.env.LOCAL_PANEL_TARBALL;
          const manifest = JSON.parse(await readFile(packageJsonPath, 'utf8'));
          const field = ['dependencies', 'devDependencies'].find(
            (name) => manifest[name]?.['@takazudo/zdtp'] !== undefined,
          );
          if (!field) {
            console.error('The example does not declare @takazudo/zdtp');
            process.exit(1);
          }
          console.log(`${field}["@takazudo/zdtp"]: ${manifest[field]['@takazudo/zdtp']} -> file:${panelTarball}`);
          manifest[field]['@takazudo/zdtp'] = `file:${panelTarball}`;
          await writeFile(packageJsonPath, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          NODE

      - name: Install the consumer example and verify the installed panel
        env:
          EXAMPLE_DIR: ${{ runner.temp }}/example
          PANEL_VERSION: ${{ steps.panel.outputs.version }}
          PANEL_DIST_HASH: ${{ steps.panel.outputs.dist-hash }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir "$EXAMPLE_DIR" install --no-frozen-lockfile

          installed="$(readlink -f "$EXAMPLE_DIR/node_modules/@takazudo/zdtp")"
          installed_version="$(node -p 'require(process.argv[1]).version' "$installed/package.json")"
          installed_hash="$(cd "$installed/dist" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "Installed ${installed}"
          echo "Installed @takazudo/zdtp ${installed_version}, dist sha256 ${installed_hash}"
          if [ "$installed_version" != "$PANEL_VERSION" ] || [ "$installed_hash" != "$PANEL_DIST_HASH" ]; then
            echo "The example did not install the packed panel (expected ${PANEL_VERSION} / ${PANEL_DIST_HASH})" >&2
            exit 1
          fi

      - name: Build the consumer example
        env:
          EXAMPLE_DIR: ${{ runner.temp }}/example
        run: pnpm --dir "$EXAMPLE_DIR" build

      - name: Serve the consumer example and probe the panel
        env:
          EXAMPLE: ${{ matrix.example }}
          EXAMPLE_DIR: ${{ runner.temp }}/example
          PANEL_VERSION: ${{ steps.panel.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Next uses a static export to out/; the other four build to dist/.
          case "$EXAMPLE" in
            nextjs) output_dir="$EXAMPLE_DIR/out" ;;
            *) output_dir="$EXAMPLE_DIR/dist" ;;
          esac
          if [ ! -f "$output_dir/index.html" ]; then
            echo "The example build did not produce ${output_dir}/index.html" >&2
            exit 1
          fi

          python3 -m http.server 4321 \
            --bind 127.0.0.1 \
            --directory "$output_dir" \
            >"$RUNNER_TEMP/example-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/example-server.log"
              exit 1
            fi
            sleep 1
          done

          node scripts/cross-example-probe.mjs \
            --url http://127.0.0.1:4321/ \
            --example "$EXAMPLE" \
            --expect-version "$PANEL_VERSION"

      - name: Open or update the cross-example drift issue
        if: ${{ failure() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DRIFT_MARKER: '<!-- consumer-drift:cross-example -->'
          EXAMPLE: ${{ matrix.example }}
        with:
          script: |
            const marker = process.env.DRIFT_MARKER;
            const example = process.env.EXAMPLE;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const title = 'Consumer drift: cross-example panel smoke failed';
            const body = `${marker}
            ## Cross-example panel drift

            The weekly scheduled cross-example consumer smoke failed for \`${example}\` (trigger: \`${context.eventName}\`). It builds the example's current \`main\` against this commit's packed panel and opens the panel through the example's own trigger.

            - Run: ${runUrl}
            - Commit: \`${context.sha}\`

            Check the failing step first: an install, packed-panel verification or build failure stops the job before the browser probe runs.

            This issue is deduplicated by the marker above and will be updated by the next failed run.`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${marker}"`,
            });
            const existing = search.data.items.find((item) => item.body?.includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              console.log(`Updated existing drift issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              console.log(`Created drift issue #${created.data.number}`);
            }
