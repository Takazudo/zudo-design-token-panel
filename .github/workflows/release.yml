# release.yml
#
# Publishes the npm package(s) in this workspace on a v* tag push. Only the
# panel (@takazudo/zdtp) is non-private, so it is the only package published;
# the root and `doc` workspaces are private and pnpm skips them.
#
# IMPORTANT: NPM_TOKEN must be an Automation-type token (bypasses 2FA).
# A standard user token fails in unattended CI publish because npm requires
# 2FA for scoped publish unless the token type is "Automation".
# Create one at https://www.npmjs.com/settings/<user>/tokens, type "Automation".
#
# ── dist-tag policy ──────────────────────────────────────────────────────────
#   Tag matching *-next.*, *-beta.*, or *-rc.*  → npm dist-tag "next"
#   All other v* tags                           → npm dist-tag "latest"
# Prerelease consumers opt in with `pnpm add @takazudo/zdtp@next`.
#
# Stale-`next` cleanup (#345): the package does not currently maintain a
# prerelease line, so a leftover `next` tag can silently lag `latest` (a host
# resolving `@next` would get an older build). On every stable publish, the
# "Drop stale next dist-tag" step below removes `next` IF it points behind the
# just-published `latest` — a legitimately-ahead prerelease `next` is preserved.
#
# The pre-publish test gate lives upstream in ci.yml / pr-checks.yml (the panel's
# test suite needs Playwright Chromium for browser tests). `prepublishOnly` here
# runs `pnpm build` only — it freshens dist/ but does not re-run browser tests.
#
# Action SHAs are pinned to immutable commits (OpenSSF best practice); the
# trailing comment names the release for human readability.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip the npm publish step"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # id-token: write enables npm OIDC-attested provenance via --provenance.
      # Each published tarball carries a signed attestation linking to this run.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @takazudo/zdtp build

      - name: Determine dist-tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -next\. ]] || [[ "$TAG" =~ -beta\. ]] || [[ "$TAG" =~ -rc\. ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Resolved dist-tag: $DIST_TAG (from ref: $GITHUB_REF)"

      - name: DRY RUN — skip publish
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo "DRY RUN — would have published with dist-tag '$DIST_TAG'."
          echo "Set dry_run=false on a real v* tag push to publish."

      # Guard: a manual workflow_dispatch on a branch (not a v* tag) must not
      # accidentally publish. dry_run=true is the only safe way to exercise this
      # workflow from a branch.
      - name: Verify publish context (tag ref required)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "::error::Publish requires a v* tag ref. Got: $GITHUB_REF."
            echo "::error::For manual smoke tests, re-run workflow_dispatch with dry_run=true."
            exit 1
          fi

      - name: Publish to npm
        if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm -r publish --tag "$DIST_TAG" --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Drop a stale `next` dist-tag on stable releases (#345). Only removes
      # `next` when it lags the just-published `latest`; a legitimately-ahead
      # prerelease `next` is left intact. semver-sort decides "behind": if the
      # greater of {next, latest} is latest, next is stale. Idempotent — a no-op
      # when there is no `next` tag.
      - name: Drop stale next dist-tag (stable releases)
        if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/v') && env.DIST_TAG == 'latest' }}
        shell: bash
        run: |
          PKG="@takazudo/zdtp"
          NEXT_VER=$(npm dist-tag ls "$PKG" | awk -F': ' '/^next:/{print $2}')
          if [ -z "$NEXT_VER" ]; then
            echo "No 'next' dist-tag on $PKG — nothing to drop."
            exit 0
          fi
          LATEST_VER=$(npm dist-tag ls "$PKG" | awk -F': ' '/^latest:/{print $2}')
          GREATEST=$(npx --yes semver "$NEXT_VER" "$LATEST_VER" | tail -1)
          if [ "$NEXT_VER" != "$LATEST_VER" ] && [ "$GREATEST" = "$LATEST_VER" ]; then
            echo "Dropping stale '$PKG@next' ($NEXT_VER < latest $LATEST_VER)…"
            npm dist-tag rm "$PKG" next
          else
            echo "Keeping '$PKG@next' ($NEXT_VER) — not behind latest ($LATEST_VER)."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
