# release.yml
#
# Publishes @takazudo/zdtp to npm on a v* tag and finalizes its GitHub Release.
# Started by a v* tag push, or dispatched at a v* tag (resume, or by
# release-coordinator.yml after it created the tag with GITHUB_TOKEN).
# The full procedure (version choice, changelog, candidate gate, tagging,
# monitoring, recovery) is docs/releasing.md; the rules it shares with this
# workflow live in scripts/release/.
#
# ── npm authentication: trusted publishing (OIDC) only ───────────────────────
# There is NO npm token. The publish job gets a short-lived credential from npm
# by exchanging this job's GitHub OIDC identity (`id-token: write`). npm
# accepts it because @takazudo/zdtp has a trusted publisher for:
#   owner Takazudo · repo zudo-design-token-panel · workflow release.yml ·
#   no environment · allowed action: npm publish
# Keep this filename stable — it is part of that identity. Do not add an
# NPM_TOKEN / NODE_AUTH_TOKEN secret back: the publish step refuses one.
# (setup-node's `registry-url` writes a literal XXXXX placeholder into
# NODE_AUTH_TOKEN; that is not a credential.)
# If publishing fails with `Skipped OIDC` / ENEEDAUTH / E404 on PUT, see
# "Troubleshooting OIDC" in docs/releasing.md.
#
# ── dist-tag policy ──────────────────────────────────────────────────────────
#   *-next.N, *-beta.N, *-rc.N → npm dist-tag "next" (GitHub prerelease)
#   clean X.Y.Z                → npm dist-tag "latest"
#   any other prerelease suffix is refused.
# Stale-`next` cleanup stays out-of-band in prune-stale-next-dist-tag.yml.
#
# ── jobs ─────────────────────────────────────────────────────────────────────
#   gate     (read-only) re-checks the release identity in Actions: tag ==
#            package.json version at this SHA, SHA on main, ci.yml green for
#            exactly this SHA, no dist-tag regression, already-published →
#            finalize only. Branch dry runs skip all of it.
#   publish  (id-token: write) dry run: build + pack listing, nothing else.
#            real: OIDC publish with provenance, skipped when already published.
#   finalize (contents: write, ephemeral GITHUB_TOKEN) registry read-back +
#            provenance/signature checks, then creates — or confirms — the
#            GitHub Release from the tagged changelog page. Never on dry runs.
#
# A red run does NOT imply npm was not published (pnpm can fail after the PUT
# landed, or a re-run can hit "cannot publish over"). Always read the registry:
#   node scripts/release/release.mjs status --version <version>
#
# Action SHAs are pinned to immutable commits (OpenSSF best practice); the
# trailing comment names the release for human readability.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; no npm publication and no GitHub Release"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read ci.yml runs for the exact commit
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      version: ${{ steps.gate.outputs.version }}
      dist_tag: ${{ steps.gate.outputs.dist_tag }}
      publish: ${{ steps.gate.outputs.publish }}
      finalize: ${{ steps.gate.outputs.finalize }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Gate release identity
        id: gate
        run: node scripts/release/release.mjs actions-gate
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}

  publish:
    name: ${{ needs.gate.outputs.mode == 'dry-run' && 'Build (dry run)' || 'Publish to npm' }}
    needs: gate
    if: needs.gate.outputs.mode == 'dry-run' || needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    # Serialize real publishes of this package across tags so the in-job
    # registry re-check cannot race another release (dist-tag regression);
    # never cancel an active publish. Note GitHub keeps only ONE pending job per
    # group: a third concurrent release would cancel the queued one, which then
    # shows `cancelled` and is resumed with `release.mjs dispatch --ref v<V>`.
    # The prune workflow is kept out of this group on purpose (it would cancel
    # a queued publish) and refuses to run while a release run is unfinished.
    # Dry runs get a private group so they never queue behind a real release.
    concurrency:
      group: ${{ needs.gate.outputs.mode == 'release' && 'npm-registry-takazudo-zdtp' || format('release-dry-run-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: DRY RUN — build and list the package (no publish)
        if: needs.gate.outputs.mode == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @takazudo/zdtp build
          pnpm --filter @takazudo/zdtp pack --pack-destination "$RUNNER_TEMP/pack"
          tar -tzf "$RUNNER_TEMP"/pack/*.tgz | sort
          echo "DRY RUN — built @takazudo/zdtp@${{ needs.gate.outputs.version }}; nothing was published and no GitHub Release was created."

      # Real publishes build via prepublishOnly (pnpm build) inside pnpm publish.
      - name: Publish to npm (OIDC)
        id: publish
        if: needs.gate.outputs.mode == 'release'
        run: >-
          node scripts/release/release.mjs publish
          --version "${{ needs.gate.outputs.version }}"
          --dist-tag "${{ needs.gate.outputs.dist_tag }}"

  finalize:
    name: Verify registry and finalize GitHub Release
    needs: [gate, publish]
    # Runs when the gate chose a real release and publication either succeeded
    # or was skipped because the version is already on npm. Never on dry runs.
    if: >-
      always() && needs.gate.result == 'success' &&
      needs.gate.outputs.finalize == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25 # verify-registry waits up to ~10 min for registry propagation
    permissions:
      contents: write # create the GitHub Release (ephemeral GITHUB_TOKEN)
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify the exact version on the registry
        run: >-
          node scripts/release/release.mjs verify-registry
          --version "${{ needs.gate.outputs.version }}"
          --sha "${{ github.sha }}"
          --audit-signatures
          ${{ needs.publish.outputs.published == 'true' && format('--published-run-id {0}', github.run_id) || '' }}

      - name: Create or confirm the GitHub Release
        run: >-
          node scripts/release/release.mjs finalize
          --version "${{ needs.gate.outputs.version }}"
          --sha "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
