name: Wind demo PR preview

# Builds the Wind demo demo and uploads a per-PR preview via
# `wrangler versions upload --preview-alias=pr-<N>`. A Worker that does not
# exist yet is bootstrapped by scripts/upload-demo-preview.sh. The upload is
# not reported as a preview when the alias URL is missing.

on:
  pull_request:
    branches:
      - main
      - 'base/**'
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'no-preview' && format('zdtp-demo-zudowind-pr-label-{0}', github.run_id) || format('zdtp-demo-zudowind-pr-{0}', github.event.number) }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & deploy Wind demo PR preview (Cloudflare Workers)
    if: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'no-preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wind demo
        run: pnpm --filter demo-zudowind build:deploy

      - name: Validate wrangler config (dry-run, no credentials needed)
        run: pnpm --dir demos/zudowind exec wrangler deploy --dry-run

      - name: Deploy Wind demo PR preview
        id: deploy
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'no-preview') &&
          vars.CF_WORKERS_DEPLOY == 'true' &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -o pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::Skipping Wind demo PR preview upload — Cloudflare credentials are unavailable for this PR."
            exit 0
          fi
          SLUG="pr-${PR_NUMBER}"
          DEPLOY_LOG=$(mktemp)
          bash scripts/upload-demo-preview.sh demos/zudowind zdtp-demo-zudowind "$SLUG" \
            "Wind demo PR #${PR_NUMBER} preview @ ${GITHUB_SHA:0:7}" \
            2>&1 | tee "$DEPLOY_LOG"
          DEPLOY_URL=$(grep -oE "https://${SLUG}-[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Failed to parse alias preview URL for slug '$SLUG' from wrangler output"
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $DEPLOY_URL"

      - name: Comment Wind demo preview URL on PR
        if: steps.deploy.outcome == 'success' && steps.deploy.outputs.deploy_url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          PR_NUMBER: ${{ github.event.number }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- cf-zudowind-preview-pr -->';
            const body = `${marker}\n### Wind demo preview\n\nPR preview deployed: ${deployUrl}\n\n_Updated for commit \`${context.sha.substring(0, 7)}\`._`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
