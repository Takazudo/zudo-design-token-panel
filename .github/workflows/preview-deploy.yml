name: Named preview deploy

# Builds the doc site and deploys a named preview to Cloudflare Workers via
# `wrangler versions upload --preview-alias=<branch-slug>` (a stable
# *.workers.dev alias URL). Build + wrangler dry-run always run (no credentials
# needed); the actual upload, commit status, and PR comment are gated on the
# repository variable CF_WORKERS_DEPLOY == 'true'.

on:
  push:
    branches:
      - preview
      - 'expreview/**'

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & deploy named preview (Cloudflare Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build doc site (emits doc/dist/_worker.js via the CF adapter)
        run: pnpm build

      - name: Generate doc history
        run: pnpm --filter doc gen:doc-history

      - name: Write .assetsignore (exclude worker entry from public assets)
        run: printf '%s\n' '_worker.js' '_zfb_inner.mjs' > doc/dist/.assetsignore

      - name: Validate wrangler config (dry-run, no credentials needed)
        run: pnpm exec wrangler deploy --dry-run

      - name: Determine branch slug
        id: branch
        env:
          GITHUB_REF_NAME_VAL: ${{ github.ref_name }}
        run: |
          # wrangler preview aliases must be lowercase [a-z0-9-] (no slashes,
          # underscores, dots, or uppercase). Lowercase, replace every invalid
          # char with a hyphen, collapse repeats, trim. e.g. expreview/Feat_X
          # -> expreview-feat-x
          SLUG=$(echo "$GITHUB_REF_NAME_VAL" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Branch slug: $SLUG"

      - name: Deploy named preview (preview alias)
        id: deploy
        if: vars.CF_WORKERS_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -o pipefail
          SLUG="${{ steps.branch.outputs.slug }}"
          DEPLOY_LOG=$(mktemp)
          pnpm exec wrangler versions upload \
            --preview-alias="$SLUG" \
            --message="Named preview ${REF_NAME} @ ${GITHUB_SHA:0:7}" \
            2>&1 | tee "$DEPLOY_LOG"
          DEPLOY_URL=$(grep -oE "https://${SLUG}-[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Failed to parse alias preview URL for slug '$SLUG' from wrangler output"
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $DEPLOY_URL"

      - name: Set commit status
        if: always() && vars.CF_WORKERS_DEPLOY == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL || '';
            const outcome = process.env.DEPLOY_OUTCOME || 'failure';
            const state = outcome === 'success' ? 'success' : 'failure';
            const description = outcome === 'success'
              ? 'Named preview deployed'
              : 'Named preview deploy failed';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'cloudflare-workers/named-preview',
              description,
              target_url: deployUrl || `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Comment on associated PR (if any)
        if: steps.deploy.outcome == 'success' && steps.deploy.outputs.deploy_url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const refName = process.env.REF_NAME;
            const marker = '<!-- cf-preview-branch -->';

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${refName}`,
              state: 'open',
            });

            if (prs.length === 0) {
              console.log('No open PR found for branch ' + refName);
              return;
            }

            const body = `${marker}\n### 🟣 Named preview deployed\n\nBranch \`${refName}\` is live at: ${deployUrl}\n\n_Updated for commit \`${context.sha.substring(0, 7)}\`._`;

            for (const pr of prs) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              const existing = comments.find((c) => c.body && c.body.startsWith(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }
