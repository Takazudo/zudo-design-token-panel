name: CI

on:
  pull_request:
    branches:
      - main
      - 'base/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build, test, typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for browser tests
        run: pnpm --filter @takazudo/zdtp exec playwright install --with-deps chromium

      - name: Build panel
        run: pnpm --filter @takazudo/zdtp build

      - name: Check packed declaration consumers
        run: pnpm check:packed-types --skip-build

      - name: Check isolated dashboard consumer
        run: pnpm check:dashboard-consumer --skip-build --output-dir test-results/dashboard-consumer

      - name: Upload dashboard consumer evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-consumer-evidence
          path: test-results/dashboard-consumer/
          if-no-files-found: warn

      - name: Build playground deploy bundle
        run: pnpm --filter playground build:deploy

      - name: Build minimal deploy bundle
        run: pnpm --filter minimal build:deploy

      - name: Test
        run: pnpm test

      - name: Visual regression tests
        # Runs after "Build panel" (dist/zdtp.css must exist). Uses the same
        # Chromium already installed for browser tests. Baselines are
        # linux-keyed so they match this ubuntu-latest runner exactly.
        # Update flow: pnpm --filter @takazudo/zdtp test:vrt:update locally,
        # review PNG diff in the PR, then commit the updated baselines.
        run: pnpm --filter @takazudo/zdtp test:vrt --output=test-results/vrt

      - name: Playground walking-skeleton E2E
        run: pnpm --filter @takazudo/zdtp test:e2e

      - name: Packed-tarball smoke
        run: pnpm --filter @takazudo/zdtp test:pack

      - name: Upload test-harness trace
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel-test-harness-trace
          path: |
            packages/zdtp/test-results/e2e/**/trace.zip
            packages/zdtp/test-results/pack/trace.zip
          # A build/unit/VRT failure can happen before either browser harness
          # creates a trace. Preserve the original failure instead of replacing
          # it with a second artifact-upload error.
          if-no-files-found: warn

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  consumer-smoke:
    name: Consumer smoke (local panel + doc)
    # Keep this lane informational until the unpublished-panel workflow has
    # proven stable enough to make it a required repository check.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the consumer probe
        run: pnpm --filter @takazudo/zdtp exec playwright install --with-deps chromium

      - name: Build and pack the local panel
        id: panel
        shell: bash
        run: |
          set -euo pipefail
          panel_pack_dir="$RUNNER_TEMP/zdtp-panel"
          mkdir -p "$panel_pack_dir"
          pnpm --filter @takazudo/zdtp build
          pnpm --filter @takazudo/zdtp pack --pack-destination "$panel_pack_dir"
          panel_tarball="$(find "$panel_pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$panel_tarball" ]; then
            echo "The panel pack command did not produce a tarball" >&2
            exit 1
          fi
          echo "tarball=$panel_tarball" >> "$GITHUB_OUTPUT"

      - name: Build and exercise scratch doc with the local packed panel
        env:
          PANEL_TARBALL: ${{ steps.panel.outputs.tarball }}
        run: bash scripts/verify-packed-remount-consumer.sh --panel-tarball "$PANEL_TARBALL"
