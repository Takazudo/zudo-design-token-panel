name: CI

on:
  pull_request:
    branches:
      - main
      - 'base/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build, test, typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for browser tests
        run: pnpm --filter @takazudo/zdtp exec playwright install --with-deps chromium

      - name: Build panel
        run: pnpm --filter @takazudo/zdtp build

      - name: Test
        run: pnpm test

      - name: Visual regression tests
        # Runs after "Build panel" (dist/zdtp.css must exist). Uses the same
        # Chromium already installed for browser tests. Baselines are
        # linux-keyed so they match this ubuntu-latest runner exactly.
        # Update flow: pnpm --filter @takazudo/zdtp test:vrt:update locally,
        # review PNG diff in the PR, then commit the updated baselines.
        run: pnpm --filter @takazudo/zdtp test:vrt

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
