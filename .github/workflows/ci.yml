name: CI

on:
  pull_request:
    branches:
      - main
      - 'base/initial-port'
      - 'base/initial-port-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build, test, typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # examples/zfb/package.json uses link:../../../zfb/packages/{zfb,zfb-runtime}
      # which resolves to {GITHUB_WORKSPACE}/../zfb/packages/{zfb,zfb-runtime}
      # (three levels up from examples/zfb/ = workspace root; one more up = its parent).
      # actions/checkout rejects paths outside GITHUB_WORKSPACE, so we use git clone.
      # Cargo.lock is gitignored in zudo-front-builder; use the HEAD SHA as the cache key.
      - name: Clone zfb sibling repo and capture HEAD SHA
        id: zfb-sha
        run: |
          git clone --depth=1 https://github.com/Takazudo/zudo-front-builder.git ../zfb
          SHA=$(git -C ../zfb rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Cache Cargo registry and the compiled zfb binary.
      # Key uses the zfb HEAD SHA (Cargo.lock is gitignored in zudo-front-builder).
      # Cold install takes ~3-5 min; warm hits are <5 s.
      - name: Restore Cargo / zfb binary cache
        id: cargo-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/zfb
          key: cargo-zfb-${{ runner.os }}-${{ steps.zfb-sha.outputs.sha }}
          restore-keys: |
            cargo-zfb-${{ runner.os }}-

      # zfb's pnpm node_modules in the cloned sibling repo are required for
      # TWO independent reasons, so this step runs on every job (no cache-hit
      # guard):
      #
      #   1. Cold cargo install: zfb's build.rs reads framework packages
      #      (e.g. preact@10.29.1) from ../zfb/node_modules/.pnpm and panics
      #      with "framework package not found" if they're missing.
      #
      #   2. Example bundling (warm cargo cache): `zfb build` in
      #      examples/zfb/ bundles zfb-runtime source files via esbuild,
      #      which then needs to resolve zfb-runtime's runtime deps like
      #      `hono` from ../zfb/node_modules. Skipping this on cache-hit
      #      causes "Could not resolve 'hono'" at example build time.
      - name: Install zfb workspace deps (required by zfb's cargo build script and example bundling)
        working-directory: ../zfb
        run: pnpm install --frozen-lockfile

      - name: Install zfb CLI
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — building zfb from source (this may take ~3-5 min)"
          START=$(date +%s)
          # `--force` because `restore-keys` may have laid down a stale
          # `~/.cargo/bin/zfb` from a previous zfb SHA's cache. Without it,
          # `cargo install` errors with "binary `zfb` already exists in
          # destination" and aborts the job.
          cargo install --force --path ../zfb/crates/zfb
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "zfb install completed in ${ELAPSED} seconds"
          if [ "${ELAPSED}" -gt 300 ]; then
            echo "::warning::zfb cargo install took ${ELAPSED}s (>5 min). Consider switching to a published binary when zfb provides one."
          fi

      - name: Verify zfb CLI
        run: zfb --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
