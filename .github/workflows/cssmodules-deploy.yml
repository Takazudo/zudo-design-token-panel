name: Deploy CSS Modules demo (production)

# Builds the CSS Modules demo demo and deploys it to Cloudflare Workers static assets.
# Custom domain https://zdtp-demo-cssmodules.zudolab.dev/ comes from demos/cssmodules/wrangler.toml.
# wrangler deploy runs only when CF_WORKERS_DEPLOY == 'true' and this SHA is
# still origin/main, so an older run cannot replace a newer deployment.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zdtp-demo-cssmodules-production-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build & deploy CSS Modules demo (Cloudflare Workers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CSS Modules demo
        run: pnpm --filter demo-cssmodules build:deploy

      - name: Validate wrangler config (dry-run, no credentials needed)
        run: pnpm --dir demos/cssmodules exec wrangler deploy --dry-run

      - name: Refuse an older commit after a newer main exists
        id: freshness
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "${ github.sha }" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CSS Modules demo deploy. origin/main is $latest and this run is ${ github.sha }."
          fi

      - name: Deploy CSS Modules demo to Cloudflare Workers (production)
        if: >-
          steps.freshness.outputs.current == 'true' &&
          vars.CF_WORKERS_DEPLOY == 'true' &&
          !contains(github.event.head_commit.message, '[skip site deploy]')
        env:
          CLOUDFLARE_API_TOKEN: ${ secrets.CLOUDFLARE_API_TOKEN }
          CLOUDFLARE_ACCOUNT_ID: ${ secrets.CLOUDFLARE_ACCOUNT_ID }
        run: |
          set -o pipefail
          n=0
          until [ "$n" -ge 3 ]; do
            pnpm --dir demos/cssmodules exec wrangler deploy 2>&1 | tee deploy.log && break
            n=$((n + 1))
            echo "wrangler deploy failed (attempt $n/3); retrying in 30s..."
            sleep 30
          done
          [ "$n" -lt 3 ]

      - name: Go-live gate notice
        if: vars.CF_WORKERS_DEPLOY != 'true'
        run: |
          echo "::notice::Skipping CSS Modules demo production deploy — repository variable CF_WORKERS_DEPLOY is not 'true'. Build + wrangler dry-run ran; the site was NOT published."
