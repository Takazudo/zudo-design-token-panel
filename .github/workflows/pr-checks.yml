name: PR preview deploy

# Builds the doc site and deploys a per-PR preview to Cloudflare Workers via
# `wrangler versions upload --preview-alias=pr-<N>` (a stable *.workers.dev
# alias URL). Build + wrangler dry-run always run (no credentials needed) so the
# check is meaningful even before go-live; the actual upload + PR comment are
# gated on the repository variable CF_WORKERS_DEPLOY == 'true'.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & deploy PR preview (Cloudflare Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build doc site (emits doc/dist/_worker.js via the CF adapter)
        run: pnpm build

      - name: Validate doc HTML
        run: pnpm --filter doc check:html

      - name: Check doc internal links
        run: pnpm --filter doc check:links

      - name: Validate wrangler config (dry-run, no credentials needed)
        run: pnpm --dir doc exec wrangler deploy --dry-run

      - name: Deploy PR preview (preview alias)
        id: deploy
        if: vars.CF_WORKERS_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -o pipefail
          SLUG="pr-${PR_NUMBER}"
          DEPLOY_LOG=$(mktemp)
          # versions upload assigns a stable preview alias on *.workers.dev.
          # Parse the alias URL (subdomain starts with the slug), not the
          # per-version hash URL, so the comment targets the predictable host.
          pnpm --dir doc exec wrangler versions upload \
            --preview-alias="$SLUG" \
            --message="PR #${PR_NUMBER} preview @ ${GITHUB_SHA:0:7}" \
            2>&1 | tee "$DEPLOY_LOG"
          DEPLOY_URL=$(grep -oE "https://${SLUG}-[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Failed to parse alias preview URL for slug '$SLUG' from wrangler output"
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $DEPLOY_URL"

      - name: Comment preview URL on PR
        if: steps.deploy.outcome == 'success' && steps.deploy.outputs.deploy_url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          PR_NUMBER: ${{ github.event.number }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- cf-preview-pr -->';
            const body = `${marker}\n### 🟢 Cloudflare Workers preview\n\nPR preview deployed: ${deployUrl}\n\n_Updated for commit \`${context.sha.substring(0, 7)}\`._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
