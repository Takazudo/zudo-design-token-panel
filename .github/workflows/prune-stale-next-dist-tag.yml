# prune-stale-next-dist-tag.yml
#
# Manually-triggered maintenance: drop a stale npm `next` dist-tag for
# @takazudo/zdtp when it lags `latest` (#345). The package does not maintain a
# prerelease line, so a leftover `next` tag silently serves an older build to
# anyone resolving `@takazudo/zdtp@next`.
#
# Decision logic + the npm calls live in scripts/prune-stale-next-dist-tag.mjs
# (dependency-free, unit-tested comparator). This is intentionally a separate,
# manual workflow rather than a step in release.yml: registry dist-tag mutation
# is kept out of the publish job so a prune hiccup never marks a successful
# release as failed.
#
# Run from the Actions tab, or: `gh workflow run prune-stale-next-dist-tag.yml`.
#
# Auth: npm trusted publishing (OIDC) — no npm token. @takazudo/zdtp has a
# trusted publisher for this exact workflow filename (owner Takazudo, repo
# zudo-design-token-panel, no environment) with only "npm dist-tag" allowed.
# OIDC for `npm dist-tag` needs npm >= 11.21.0, so the job pins npm 11.21.0.
# Keep this filename stable. See docs/releasing.md.

name: Prune stale next dist-tag

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the decision without mutating the registry"
        type: boolean
        default: false

permissions: {}

jobs:
  prune:
    name: Prune stale next dist-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # refuse to prune while a release.yml run is unfinished
      id-token: write # npm trusted publishing (OIDC) for `npm dist-tag rm`
    # Deliberately NOT in release.yml's `npm-registry-takazudo-zdtp` group:
    # GitHub cancels a *pending* job when another joins its group, so sharing
    # it would let a prune dispatch cancel a queued release publish. The
    # script refuses to mutate while any release run is unfinished instead.
    concurrency:
      group: npm-dist-tag-maintenance
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # This job only needs node + npm (the script uses `npm dist-tag`); it
          # does NOT set pnpm up. setup-node defaults package-manager-cache to
          # true, which auto-detects pnpm from the repo and fails with
          # "Unable to locate executable file: pnpm". Disable it.
          package-manager-cache: false

      - name: Install npm 11.21.0 (OIDC dist-tag support)
        run: |
          npm install --global npm@11.21.0
          echo "npm $(npm --version)"
          test "$(npm --version)" = "11.21.0"

      - name: Prune stale next dist-tag
        run: node scripts/prune-stale-next-dist-tag.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }} # read-only Actions API (release.yml run status)
