<!doctype html><html><head><meta charset="utf-8"><title>08 · Apply preview — file diff before writing</title>
<link rel="stylesheet" href="shared.css">
<style>
.backdrop { position:fixed; inset:0; background:rgb(0 0 0 / .55); z-index:30; display:none; align-items:center; justify-content:center; }
.backdrop.is-open { display:flex; justify-content:flex-start; padding-left:24px; }
.modal { width:860px; max-width:calc(100vw - 40px); height:560px; background:var(--surface); color:var(--fg); border:1px solid var(--muted); border-radius:6px; box-shadow:0 20px 60px rgb(0 0 0 / .6); display:grid; grid-template-rows:auto 1fr auto; grid-template-columns:240px 1fr; overflow:hidden; }
.mh { grid-column:1 / -1; padding:12px 18px; border-bottom:1px solid var(--muted-2); display:flex; align-items:baseline; gap:12px; }
.mh .t { font-size:16px; color:#fff; }
.mh .s { font-size:12px; color:var(--muted); }
.files { border-right:1px solid var(--muted-2); overflow:auto; padding:8px 0; background:var(--bg); }
.file { display:flex; align-items:center; gap:8px; padding:8px 14px; cursor:pointer; font-size:12px; font-family:var(--mono); }
.file.is-sel { background:var(--surface-2); }
.file input { accent-color:var(--accent); }
.file .n { flex:1; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file .c { color:var(--muted); font-size:10px; }
.file.warn .n { color:var(--warning); }
.diff { overflow:auto; font-family:var(--mono); font-size:12px; line-height:18px; }
.diff .hunk { border-bottom:1px solid var(--muted-2); }
.diff .hh { display:flex; align-items:center; gap:8px; padding:4px 12px; background:var(--surface-2); color:var(--accent-hover); font-size:11px; position:sticky; top:0; }
.diff .hh input { accent-color:var(--accent); }
.ln { display:flex; white-space:pre; }
.ln .no { width:44px; text-align:right; padding-right:10px; color:var(--muted-2); user-select:none; flex-shrink:0; }
.ln .tx { flex:1; padding-left:8px; }
.ln.ctx { color:var(--muted); }
.ln.del { background:rgb(218 104 113 / .14); color:#f0a0a6; }
.ln.add { background:rgb(147 187 119 / .14); color:#b8e09b; }
.hunk.off .ln.del, .hunk.off .ln.add { opacity:.35; text-decoration:line-through; }
.mf { grid-column:1 / -1; border-top:1px solid var(--muted-2); padding:10px 18px; display:flex; align-items:center; gap:12px; font-size:12px; }
.warnbox { margin:8px 14px; padding:8px 10px; border:1px solid var(--warning); border-radius:4px; font-size:11px; color:var(--warning); font-family:var(--sans); }
.warnbox code { color:#fff; }
.toast { position:fixed; right:24px; bottom:24px; z-index:40; background:#101; background:#0f1a0f; border:1px solid var(--success); color:#cfe6bf; padding:10px 14px; border-radius:6px; font-size:12px; display:none; box-shadow:0 8px 24px rgb(0 0 0 / .5); font-family:var(--mono); white-space:pre; }
.sync { font-size:11px; color:var(--success); }
.sync.dirty { color:var(--warning); }
.opt { display:flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; }
.opt input { accent-color:var(--accent); }
</style></head><body>
<script src="shared.js"></script>
<script>
const { el, I, DATA, section, row } = Z;
Z.host();
const sync = el('span', { class: 'sync dirty', html: '● 7 unsaved' });
const ui = Z.shell({ active: 'Spacing', headerExtra: [sync], onAction: (a) => a === 'Apply' && openModal() });
const sp = DATA.tabs.find((t) => t.id === 'spacing');
for (const tier of sp.tiers.slice(0, 2)) ui.body.append(section(tier.label, el('div', { class: 'grid' }, tier.items.map((t) => row(t, tier.unit)))));

/* what the bin would write — one hunk per token, grouped by routed file */
const FILES = [
  { path: 'src/styles/tokens.css', block: ':root', lines: [
    ':root {', '  /* spacing */', '  --spacing-hsp-2xs: 0.125rem;', '  --spacing-hsp-xs: 0.375rem;', '  --spacing-hsp-sm: 0.5rem;', '  --spacing-hsp-md: 0.75rem;', '  --spacing-hsp-lg: 1rem;', '  --spacing-hsp-xl: 1.5rem;', '  --spacing-hsp-2xl: 2rem;', '', '  --spacing-vsp-sm: 1.25rem;', '  --spacing-vsp-md: 1.5rem;', '', '  /* type */', '  --text-scale-md: 1.2rem;', '  --leading-normal: 1.5;', '}'],
    changes: [['--spacing-hsp-md', '0.75rem', '1rem'], ['--spacing-hsp-xl', '1.5rem', '1.75rem'], ['--spacing-vsp-sm', '1.25rem', '1.5rem'], ['--text-scale-md', '1.2rem', '1.25rem'], ['--leading-normal', '1.5', '1.55']] },
  { path: 'src/styles/theme.css', block: '@theme', lines: ['@import "tailwindcss";', '', '@theme {', '  --radius-DEFAULT: 4px;', '  --radius-lg: 8px;', '  --default-transition-duration: 150ms;', '}'],
    changes: [['--radius-lg', '8px', '12px'], ['--default-transition-duration', '150ms', '120ms']] },
];
const UNROUTED = ['--spacing-icon-md'];
let selFile = 0, fullFile = false;
const off = new Set();
const filesEl = el('div', { class: 'files' }), diffEl = el('div', { class: 'diff' }), foot = el('div', { class: 'mf' });
const modal = el('div', { class: 'modal', role: 'dialog' }, [el('div', { class: 'mh' }), filesEl, diffEl, foot]);
const backdrop = el('div', { class: 'backdrop' }, [modal]); document.body.append(backdrop);
const toast = el('div', { class: 'toast' }); document.body.append(toast);
const enabledCount = () => FILES.reduce((n, f) => n + f.changes.filter((c) => !off.has(c[0])).length, 0);
const enabledFiles = () => FILES.filter((f) => f.changes.some((c) => !off.has(c[0])));

function renderModal() {
  modal.querySelector('.mh').innerHTML = `<span class="t">Apply to disk</span><span class="s">${enabledCount()} token${enabledCount() === 1 ? '' : 's'} → ${enabledFiles().length} file${enabledFiles().length === 1 ? '' : 's'} · bin at 127.0.0.1:24681 · write-root <code>./src</code></span>`;
  filesEl.innerHTML = '';
  FILES.forEach((f, i) => {
    const n = f.changes.filter((c) => !off.has(c[0])).length;
    const cb = el('input', { type: 'checkbox', checked: n > 0, onclick: (e) => { e.stopPropagation(); f.changes.forEach((c) => (cb.checked ? off.delete(c[0]) : off.add(c[0]))); renderModal(); } });
    filesEl.append(el('div', { class: 'file' + (i === selFile ? ' is-sel' : ''), onclick: () => { selFile = i; renderModal(); } }, [cb, el('span', { class: 'n' }, f.path), el('span', { class: 'c' }, `${n}/${f.changes.length} · ${f.block}`)]));
  });
  if (UNROUTED.length) filesEl.append(el('div', { class: 'warnbox', html: `<b>Not routed</b> — ${UNROUTED.map((u) => `<code>${u}</code>`).join(', ')} changed in the panel but has no entry in <code>panel-routing.json</code>, so it stays browser-only. <span class="link" style="font-size:11px">Copy as CSS</span>` }));
  /* diff */
  const f = FILES[selFile]; diffEl.innerHTML = '';
  const byVar = Object.fromEntries(f.changes.map((c) => [c[0], c]));
  let hunk = null, hunkVar = null;
  const pushLine = (cls, no, tx) => (hunk || diffEl).append(el('div', { class: 'ln ' + cls }, [el('span', { class: 'no' }, no ?? ''), el('span', { class: 'tx' }, tx)]));
  f.lines.forEach((line, i) => {
    const m = line.match(/^\s*(--[\w-]+):/);
    const ch = m && byVar[m[1]];
    if (ch) {
      hunk = el('div', { class: 'hunk' + (off.has(ch[0]) ? ' off' : '') });
      const cb = el('input', { type: 'checkbox', checked: !off.has(ch[0]), onchange: () => { cb.checked ? off.delete(ch[0]) : off.add(ch[0]); renderModal(); } });
      hunk.append(el('div', { class: 'hh' }, [cb, el('span', {}, `@@ line ${i + 1} · ${ch[0]}`), el('span', { class: 'spacer' }), el('span', { class: 'muted' }, `${ch[1]} → ${ch[2]}`)]));
      if (!fullFile && i > 0) pushLine('ctx', i, f.lines[i - 1]);
      pushLine('del', i + 1, '- ' + line);
      pushLine('add', i + 1, '+ ' + line.replace(ch[1] + ';', ch[2] + ';'));
      if (!fullFile && f.lines[i + 1] !== undefined) pushLine('ctx', i + 2, f.lines[i + 1]);
      diffEl.append(hunk); hunk = null;
    } else if (fullFile) pushLine('ctx', i + 1, '  ' + line);
  });
  foot.innerHTML = '';
  const full = el('input', { type: 'checkbox', checked: fullFile, onchange: () => { fullFile = full.checked; renderModal(); } });
  foot.append(el('label', { class: 'opt' }, [full, 'Show full file']), el('span', { class: 'hint' }, 'atomic: temp file + rename, all-or-nothing across files'), el('span', { class: 'spacer' }),
    el('button', { class: 'btn', onclick: close }, 'Cancel'), el('button', { class: 'btn primary', onclick: write }, `Write ${enabledFiles().length} file${enabledFiles().length === 1 ? '' : 's'} (${enabledCount()} tokens)`));
}
function openModal() { backdrop.classList.add('is-open'); renderModal(); }
function close() { backdrop.classList.remove('is-open'); }
function write() {
  close();
  toast.style.display = 'block';
  toast.textContent = '✓ wrote ' + enabledFiles().map((f) => `${f.path} (${f.changes.filter((c) => !off.has(c[0])).length})`).join('\n  wrote ') + (UNROUTED.length ? `\n! skipped ${UNROUTED.length} unrouted` : '');
  sync.className = 'sync'; sync.innerHTML = '✓ in sync with disk';
  setTimeout(() => (toast.style.display = 'none'), 3500);
}
backdrop.addEventListener('click', (e) => e.target === backdrop && close());
document.addEventListener('keydown', (e) => e.key === 'Escape' && close());
openModal();
Z.banner(`<b>Idea 08 — Preview the write before it happens.</b> "Apply" currently POSTs and reports; you read the result after the files changed. This modal shows the bin's plan first: <b>which files</b>, the exact <b>+/- lines</b> inside the scanned <code>:root</code>/<code>@theme</code> block, a checkbox per token (deselect one you're not ready to commit), a loud row for tokens that have <b>no routing entry</b>, and a header dot that says whether the browser state is in sync with disk.`);
</script></body></html>
