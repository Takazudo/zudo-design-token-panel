<!doctype html><html><head><meta charset="utf-8"><title>07 · Resolution chain + "used by"</title>
<link rel="stylesheet" href="shared.css">
<style>
.chainbtn { color:var(--muted); cursor:pointer; display:inline-flex; }
.chainbtn svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; }
.chainbtn:hover, .row.is-open .chainbtn { color:var(--accent); }
.usecount { font-family:var(--mono); font-size:10px; color:var(--muted); min-width:18px; text-align:right; }
.chain { display:none; margin:6px 0 4px 0; padding:10px 12px; background:var(--bg); border:1px solid var(--muted-2); border-radius:6px; font-family:var(--mono); font-size:11px; }
.row.is-open .chain { display:block; }
.hops { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.hop { display:inline-flex; align-items:center; gap:6px; background:var(--code-bg); color:var(--code-fg); padding:2px 8px; border-radius:4px; }
.hop.lit { color:var(--accent-hover); }
.hop i { width:12px; height:12px; border-radius:2px; border:1px solid rgb(255 255 255 / .25); display:inline-block; }
.arrow { color:var(--muted); }
.kv { display:flex; gap:10px; margin-top:8px; align-items:center; flex-wrap:wrap; color:var(--muted); }
.kv .k { width:100px; text-transform:uppercase; letter-spacing:.06em; font-size:9px; }
.kv .chip { cursor:pointer; }
.kv .chip:hover { color:var(--accent); }
.hl { background:none; border:1px solid var(--muted-2); color:var(--fg); border-radius:3px; padding:1px 8px; font:inherit; font-size:11px; cursor:pointer; }
.hl:hover { border-color:var(--accent); color:var(--accent); }
.hl.on { background:var(--accent); color:#111; border-color:var(--accent); }
.row.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%{ background:rgb(214 154 102 / .35);} 100%{ background:transparent;} }
.tip { position:fixed; z-index:99; pointer-events:none; background:#000; color:#ddd; border:1px solid var(--muted-2); font-family:var(--mono); font-size:11px; padding:4px 8px; border-radius:4px; display:none; white-space:nowrap; }
.host-body .card, .host-body .btn { outline: 0 solid transparent; transition: outline-width 150ms; }
body.hl-accent .host-body .btn, body.hl-accent .host-header .brand { outline: 2px solid #ff3b30; outline-offset:2px; }
</style></head><body>
<script src="shared.js"></script>
<script>
const { el, I, DATA, section } = Z;
Z.host();
const ui = Z.shell({ active: 'Color' });
const tip = el('div', { class: 'tip' }); document.body.append(tip);

const PALETTE = { '--palette-base-0': '#f4f2ee', '--palette-base-1': '#eee9df', '--palette-base-2': '#6f6a62', '--palette-base-3': '#4a4640', '--palette-base-4': '#1c1c1c', '--palette-accent-0': '#f3c99b', '--palette-accent-1': '#d69a66', '--palette-accent-2': '#a35c1f' };
const SEM = DATA.tabs.find((t) => t.id === 'color').tiers[0].items;
const USED_BY_EL = { '--zd-bg': 1, '--zd-fg': 38, '--zd-surface': 6, '--zd-muted': 12, '--zd-accent': 14, '--zd-accent-hover': 9, '--zd-code-bg': 7, '--zd-code-fg': 7, '--zd-success': 0, '--zd-danger': 0, '--zd-warning': 2, '--zd-info': 3, '--zd-selection-bg': 1, '--zd-chat-user-bg': 0, '--zd-mermaid-line': 0 };
/* second-order dependents: semantic tokens that read ANOTHER semantic token (calc/color-mix) */
const DERIVED = { '--zd-accent': ['--zd-accent-hover', '--zd-link', '--zd-btn-bg', '--zd-focus-ring'], '--zd-fg': ['--zd-code-fg', '--zd-heading'], '--zd-bg': ['--zd-selection-bg'], '--zd-muted': ['--zd-mermaid-line', '--zd-border'] };

/* sRGB hex → oklch (for the literal hop) */
function hexToOklch(hex) {
  const [r, g, b] = hex.replace('#', '').match(/../g).map((h) => { const v = parseInt(h, 16) / 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
  const C = Math.hypot(A, B); let H = (Math.atan2(B, A) * 180) / Math.PI; if (H < 0) H += 360;
  return `oklch(${L.toFixed(3)} ${C.toFixed(3)} ${C < 0.005 ? 0 : H.toFixed(1)})`;
}
const sw = (hex) => `<i style="background:${hex}"></i>`;
const hop = (label, hex, lit) => `<span class="hop${lit ? ' lit' : ''}">${hex ? sw(hex) : ''}${label}</span>`;
const arrow = '<span class="arrow">→</span>';
function chainHtml(t) {
  const hops = [hop(t.v, t.hex)];
  if (t.ref) hops.push(hop(t.ref, PALETTE[t.ref]), hop(hexToOklch(PALETTE[t.ref]), null, true), hop(PALETTE[t.ref], null, true));
  else hops.push(hop('literal', null, true), hop(hexToOklch(t.hex), null, true), hop(t.hex, null, true));
  return hops.join(arrow);
}
function open(v) { const r = ui.body.querySelector(`[data-var="${v}"]`); if (!r) return; r.classList.add('is-open', 'flash'); r.scrollIntoView({ block: 'center' }); setTimeout(() => r.classList.remove('flash'), 1200); }

function semRow(t) {
  const chain = el('div', { class: 'chain' });
  const n = USED_BY_EL[t.v] ?? 0;
  const hlBtn = el('button', { class: 'hl', onclick: () => { hlBtn.classList.toggle('on'); document.body.classList.toggle('hl-accent', hlBtn.classList.contains('on') && t.v === '--zd-accent'); } }, 'highlight on page');
  chain.append(
    el('div', { class: 'hops', html: chainHtml(t) }),
    el('div', { class: 'kv' }, [el('span', { class: 'k' }, 'used on page'), el('span', { style: 'color:var(--fg)' }, n ? `${n} element${n > 1 ? 's' : ''}` : 'not used on this page'), n ? hlBtn : el('span', { class: 'chip', style: 'opacity:.6' }, 'safe to drop?')]),
    el('div', { class: 'kv' }, [el('span', { class: 'k' }, 'depended on by'), ...((DERIVED[t.v] || []).length ? DERIVED[t.v].map((d) => el('span', { class: 'chip', title: 'jump', onclick: () => open(d) }, d)) : [el('span', {}, '—')])]),
    t.ref ? el('div', { class: 'kv' }, [el('span', { class: 'k' }, 'siblings on ramp'), ...SEM.filter((s) => s.ref === t.ref && s.v !== t.v).map((s) => el('span', { class: 'chip', onclick: () => open(s.v) }, s.v)), el('span', { class: 'chip', onclick: () => open(t.ref) }, 'edit ' + t.ref + ' ↗')]) : null,
  );
  const r = el('div', { class: 'row', 'data-var': t.v }, [el('div', { class: 'row-head' }, [
    el('div', { class: 'lbl' }, [el('span', { class: 'var' }, t.v)]),
    el('span', { class: 'swatch', style: `background:${t.hex}` }),
    el('select', { class: 'sel', html: `<option>${t.ref || 'Literal…'}</option>` }),
    el('span', { class: 'usecount', title: 'elements using this token on the current page' }, n || '·'),
    el('span', { class: 'eye', html: I.eye }),
    el('span', { class: 'chainbtn', title: 'Show resolution chain', html: I.chain, onclick: () => r.classList.toggle('is-open') }),
  ]), chain]);
  const lbl = r.querySelector('.lbl');
  lbl.addEventListener('mousemove', (e) => { tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 14 + 'px'; tip.innerHTML = t.ref ? `${t.v} → ${t.ref} → ${PALETTE[t.ref]}` : `${t.v} = ${t.hex} (literal)`; });
  lbl.addEventListener('mouseleave', () => (tip.style.display = 'none'));
  return r;
}
function baseRow(v, hex) {
  const refs = SEM.filter((s) => s.ref === v);
  const chain = el('div', { class: 'chain' }, [
    el('div', { class: 'hops', html: hop(v, hex) + arrow + hop(hexToOklch(hex), null, true) + arrow + hop(hex, null, true) }),
    el('div', { class: 'kv' }, [el('span', { class: 'k' }, 'referenced by'), ...(refs.length ? refs.map((s) => el('span', { class: 'chip', onclick: () => open(s.v) }, s.v)) : [el('span', {}, 'nothing — unused ramp step')])]),
    el('div', { class: 'kv' }, [el('span', { class: 'k' }, 'blast radius'), el('span', { style: 'color:var(--fg)' }, `${refs.reduce((n, s) => n + (USED_BY_EL[s.v] || 0), 0)} elements change if you edit this step`)]),
  ]);
  const r = el('div', { class: 'row', 'data-var': v }, [el('div', { class: 'row-head' }, [
    el('div', { class: 'lbl' }, [el('span', { class: 'var' }, v)]), el('span', { class: 'swatch', style: `background:${hex}` }), el('input', { class: 'num', value: hex, style: 'width:90px;text-align:left' }),
    el('span', { class: 'usecount', title: 'semantic tokens referencing this' }, refs.length ? `${refs.length}⤴` : '·'),
    el('span', { class: 'chainbtn', html: I.chain, onclick: () => r.classList.toggle('is-open') }),
  ]), chain]);
  return r;
}
ui.body.append(
  section('Zudo Doc — Semantic Tokens', el('div', { class: 'grid', style: 'grid-template-columns:repeat(auto-fit,minmax(340px,1fr))' }, SEM.map(semRow))),
  section('Palette (base ramps, normally on the Palette tab)', el('div', { class: 'grid' }, Object.entries(PALETTE).map(([v, h]) => baseRow(v, h)))),
);
open('--zd-accent');
Z.banner(`<b>Idea 07 — Show the chain, both directions.</b> Semantic tokens reference ramp steps, but the row only shows a select. The 🔗 button expands <b>token → ramp step → oklch → hex</b> with swatches, how many page elements use it (and a highlight), which other tokens derive from it, and its siblings on the same ramp. On a ramp step it flips: "referenced by 3 semantic tokens, 45 elements change if you edit this". Hover a label for the one-line chain. <code>--zd-accent</code> is open.`);
</script></body></html>
