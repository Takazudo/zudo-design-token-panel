<!doctype html><html><head><meta charset="utf-8"><title>04b · Type specimen with your own text</title>
<link rel="stylesheet" href="shared.css">
<style>
:root { --spec-font: inherit; --spec-width: 420px; --text-scale-md: 1.2rem; --leading-normal: 1.5; --text-scale-xl: 3rem; }
.host-body h1 { font-size: var(--text-scale-xl); }
.host-body p { font-size: var(--text-scale-md); line-height: var(--leading-normal); }
.shell { width: 940px; }
.host { transition: right 160ms; }
/* on-page mode docks the panel right (idea 06) so the specimen on the page is actually visible */
.shell.mode-right { top:0; right:0; bottom:0; left:auto; width:470px; height:100vh; box-shadow:none; border-width:0 0 0 1px; }
.shell.mode-right .density { display:none; }
.shell.mode-right .spec-tools .fld { min-width:200px; }
.spec-tools { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; margin:-8px 0 -8px; }
.spec-tools .fld { display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--muted-2); border-radius:var(--radius); padding:2px 8px; flex:1; min-width:280px; }
.spec-tools .fld input { background:none; border:0; color:#fff; font:inherit; font-size:13px; flex:1; outline:none; min-width:0; }
.spec-tools .fld .lbl-s { color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
.presets { display:inline-flex; border:1px solid var(--muted-2); border-radius:var(--radius); overflow:hidden; }
.presets span { padding:3px 9px; cursor:pointer; color:var(--muted); font-size:12px; }
.presets span.on { background:var(--surface-2); color:var(--fg); }
.presets span:hover { color:var(--accent); }
.custom-tag { font-size:10px; color:var(--accent); cursor:pointer; }
.spec-tools select { background:var(--surface); color:var(--fg); border:1px solid var(--muted-2); border-radius:var(--radius); font:inherit; font-size:12px; padding:2px 4px; max-width:200px; }
.spec-tools .w { display:flex; align-items:center; gap:6px; color:var(--muted); }
.spec-tools .w input { width:90px; accent-color:var(--accent); }
.toggle { display:flex; align-items:center; gap:6px; color:var(--fg); cursor:pointer; user-select:none; }
.toggle input { accent-color:var(--accent); }
.fontinfo { font-family:var(--mono); font-size:10px; color:var(--muted); width:100%; }
.fontinfo b { color:var(--fg); font-weight:400; }
/* specimen rows */
.spec-row { display:grid; grid-template-columns:190px 1fr auto; align-items:center; gap:14px; padding:6px 0; border-bottom:1px dashed var(--muted-2); }
.spec-row:last-child { border-bottom:0; }
.spec-row .lbl { font-size:12px; }
.spec-row .lbl .px { color:var(--accent-hover); font-size:10px; }
.spec-text { font-family:var(--spec-font); color:#eee; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.spec-ctl { display:flex; align-items:center; gap:8px; }
.spec-row.compact .spec-text { display:none; }
.spec-row.compact { grid-template-columns:190px 1fr auto; }
.lead-row { display:grid; grid-template-columns:190px 1fr auto; align-items:start; gap:14px; padding:8px 0; border-bottom:1px dashed var(--muted-2); }
.lead-row:last-child { border-bottom:0; }
.lead-text { font-family:var(--spec-font); color:#eee; width:var(--spec-width); max-width:100%; padding:0 8px; background-color:rgb(255 255 255 / .03); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), rgb(214 154 102 / .45) calc(var(--lh) - 1px), rgb(214 154 102 / .45) var(--lh)); background-origin:content-box; border-radius:3px; }
.lead-row.compact .lead-text { display:none; }
.body.onpage .section-spec .hint-onpage { display:block; }
.hint-onpage { display:none; font-size:11px; color:var(--muted); margin:6px 0 0; }
/* on-page overlay: lives INSIDE the host document so it inherits the host's real font, color, background */
#onpage { display:none; margin:0 0 24px; padding:14px 18px; border:1px dashed #d69a66; border-radius:8px; background:#fff; }
#onpage.is-on { display:block; }
#onpage .op-h { font:11px/1.4 var(--mono); color:#a35c1f; letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px; display:flex; gap:12px; }
#onpage .op-row { display:grid; grid-template-columns:150px 1fr; gap:14px; align-items:center; padding:5px 0; border-bottom:1px dashed #e4dfd4; }
#onpage .op-row .k { font:11px var(--mono); color:#888; }
#onpage .op-text { font-family:var(--spec-font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.15; }
#onpage .op-lead { font-family:var(--spec-font); width:var(--spec-width); max-width:100%; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), rgb(214 154 102 / .5) calc(var(--lh) - 1px), rgb(214 154 102 / .5) var(--lh)); }
.hl { outline:1px solid var(--accent); outline-offset:2px; border-radius:2px; }
</style></head><body>
<script src="shared.js"></script>
<script>
const { el, I, DATA, section, row } = Z;
Z.host({ extra: '' });
const onpage = el('div', { id: 'onpage' }); document.querySelector('.host-body').prepend(onpage);

/* --- text presets; typing your own text stops presets from auto-replacing it (pattern borrowed from a font-explorer UI) --- */
const PRESETS = {
  latin: 'The quick brown fox jumps over the lazy dog — 0123456789',
  ja: 'あのイーハトーヴォのすきとおった風、夏でも底に冷たさをもつ青いそら、うつくしい森で飾られたモリーオ市、郊外のぎらぎらひかる草の波。',
  mixed: 'デザイントークン Design Tokens — 見出し Heading / 本文 Body / 0123456789',
};
let preset = localStorage.getItem('zdtp-proto-spec-preset') || 'ja';
let text = localStorage.getItem('zdtp-proto-spec-text') ?? PRESETS[preset];
let overridden = localStorage.getItem('zdtp-proto-spec-overridden') === '1';
let onPage = false;
const px = (rem) => rem * 16;
const vals = {}; /* var → number */

const font = DATA.tabs.find((t) => t.id === 'font');
const scaleTier = font.tiers[0], leadTier = font.tiers[1];
scaleTier.items.forEach((t) => (vals[t.v] = t.d)); leadTier.items.forEach((t) => (vals[t.v] = t.d));

const textInput = el('input', { value: text, placeholder: 'Type your own specimen text…', 'aria-label': 'Specimen text' });
const customTag = el('span', { class: 'custom-tag', title: 'Back to the preset text' });
const presetsEl = el('div', { class: 'presets' }, [['latin', 'Latin'], ['ja', '日本語'], ['mixed', 'Mixed']].map(([k, l]) => el('span', { class: k === preset ? 'on' : '', 'data-k': k, onclick: () => { preset = k; overridden = false; text = PRESETS[k]; sync(); } }, l)));
const widthSlider = el('input', { type: 'range', min: 240, max: 720, value: 420, oninput: () => { document.documentElement.style.setProperty('--spec-width', widthSlider.value + 'px'); widthLbl.textContent = widthSlider.value + 'px'; } });
const widthLbl = el('span', { class: 'mono' }, '420px');
const onPageCb = el('input', { type: 'checkbox', onchange: () => { onPage = onPageCb.checked; render(); } });
const fontSel = el('select', { html: '<option value="">Host font (inherit)</option><option>Noto Sans JP</option><option>Zen Kaku Gothic New</option><option>BIZ UDPGothic</option><option>Shippori Mincho</option><option>Noto Serif JP</option>' });
const fontInfo = el('div', { class: 'fontinfo' });
fontSel.addEventListener('change', () => loadCompareFont(fontSel.value));
const tools = el('div', { class: 'spec-tools' }, [
  el('div', { class: 'fld' }, [el('span', { class: 'lbl-s' }, 'Preview'), textInput, customTag]),
  presetsEl,
  el('label', { class: 'w', title: 'Paragraph width for the line-height specimen' }, ['width', widthSlider, widthLbl]),
  el('label', { class: 'toggle', title: 'Render the specimen inside the host page (real font, real colors, real background) instead of in this dark panel' }, [onPageCb, 'Render on page']),
  el('label', { class: 'w' }, ['compare', fontSel]),
  fontInfo,
]);
textInput.addEventListener('input', () => { text = textInput.value; overridden = true; sync(false); });
customTag.addEventListener('click', () => { overridden = false; text = PRESETS[preset]; sync(); });

/* lazy Google Font load: <link> + document.fonts.load, same recipe as the reference UI */
const loaded = new Set();
function loadCompareFont(family) {
  if (!family) { document.documentElement.style.setProperty('--spec-font', 'inherit'); fontInfoUpdate(); return; }
  fontInfo.innerHTML = `loading <b>${family}</b>…`;
  const apply = () => { loaded.add(family); document.documentElement.style.setProperty('--spec-font', `"${family}", sans-serif`); fontInfoUpdate(); };
  if (loaded.has(family)) return apply();
  const link = el('link', { rel: 'stylesheet', href: `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family)}:wght@400;700&display=swap` });
  link.onload = () => document.fonts.load(`400 1em "${family}"`).then(apply, apply);
  link.onerror = () => { fontInfo.innerHTML = `could not load <b>${family}</b> (offline?) — showing host font`; };
  document.head.append(link);
}
function fontInfoUpdate() {
  const fam = fontSel.value || getComputedStyle(document.body).fontFamily.split(',')[0].replace(/"/g, '');
  fontInfo.innerHTML = `specimen font: <b>${fam}</b>${fontSel.value ? ' (compare)' : ' — read from the host page, so what you see is what ships'}`;
}

const ui = Z.shell({ active: 'Font' });
const specSection = section('Scale — specimen', [], { class: 'section section-spec' });
const leadSection = section('Line height — paragraph specimen', [], { class: 'section section-spec' });
ui.body.append(tools, specSection, leadSection, el('div', { class: 'hint' }, 'Rows are the token rows themselves: edit the number on the right, the specimen re-renders at the new size. Sorted by value so the scale reads top-to-bottom.'));

function specRow(t) {
  const n = vals[t.v];
  const input = el('input', { class: 'num', value: n, oninput: () => { const v = parseFloat(input.value); if (!Number.isNaN(v)) { vals[t.v] = v; document.documentElement.style.setProperty(t.v, v + 'rem'); render(false); } } });
  const r = el('div', { class: 'spec-row' + (onPage ? ' compact' : ''), 'data-var': t.v }, [
    el('div', { class: 'lbl' }, [el('span', { class: 'var' }, t.v), el('span', { class: 'px' }, `${t.id} · ${px(n)}px`)]),
    el('div', { class: 'spec-text', style: `font-size:${px(n)}px`, title: `${px(n)}px` }, text || '…'),
    el('div', { class: 'spec-ctl' }, [input, el('span', { class: 'unit' }, 'rem'), el('span', { class: 'eye', html: I.eye })]),
  ]);
  r.addEventListener('mouseenter', () => onpage.querySelector(`[data-var="${t.v}"]`)?.classList.add('hl'));
  r.addEventListener('mouseleave', () => onpage.querySelector(`[data-var="${t.v}"]`)?.classList.remove('hl'));
  return r;
}
function leadRow(t) {
  const n = vals[t.v]; const base = px(vals['--text-scale-md']);
  const input = el('input', { class: 'num', value: n, oninput: () => { const v = parseFloat(input.value); if (!Number.isNaN(v)) { vals[t.v] = v; document.documentElement.style.setProperty(t.v, v); render(false); } } });
  return el('div', { class: 'lead-row' + (onPage ? ' compact' : ''), 'data-var': t.v }, [
    el('div', { class: 'lbl' }, [el('span', { class: 'var' }, t.v), el('span', { class: 'px' }, `${t.id} · ${(base * n).toFixed(1)}px line at ${base}px`)]),
    el('div', { class: 'lead-text', style: `font-size:${base}px;line-height:${n};--lh:${(base * n).toFixed(2)}px` }, (text + ' ').repeat(text.length < 60 ? 3 : 2).trim()),
    el('div', { class: 'spec-ctl' }, [input, el('span', { class: 'unit' }, ''), el('span', { class: 'eye', html: I.eye })]),
  ]);
}
function render(full = true) {
  const scale = [...scaleTier.items].sort((a, b) => vals[a.v] - vals[b.v]);
  const focused = document.activeElement?.closest?.('[data-var]')?.dataset.var;
  if (full || !focused) {
    specSection.querySelectorAll('.spec-row').forEach((n) => n.remove()); scale.forEach((t) => specSection.append(specRow(t)));
    leadSection.querySelectorAll('.lead-row').forEach((n) => n.remove()); leadTier.items.forEach((t) => leadSection.append(leadRow(t)));
  } else {
    /* keep the focused input alive: patch only the text/size of every row */
    specSection.querySelectorAll('.spec-row').forEach((r) => { const t = scaleTier.items.find((i) => i.v === r.dataset.var); const st = r.querySelector('.spec-text'); st.style.fontSize = px(vals[t.v]) + 'px'; st.textContent = text || '…'; r.querySelector('.px').textContent = `${t.id} · ${px(vals[t.v])}px`; });
    leadSection.querySelectorAll('.lead-row').forEach((r) => { const t = leadTier.items.find((i) => i.v === r.dataset.var); const lt = r.querySelector('.lead-text'); const base = px(vals['--text-scale-md']); lt.style.cssText = `font-size:${base}px;line-height:${vals[t.v]};--lh:${(base * vals[t.v]).toFixed(2)}px`; lt.textContent = (text + ' ').repeat(text.length < 60 ? 3 : 2).trim(); r.querySelector('.px').textContent = `${t.id} · ${(base * vals[t.v]).toFixed(1)}px line at ${base}px`; });
  }
  ui.body.classList.toggle('onpage', onPage);
  ui.shell.classList.toggle('mode-right', onPage); document.getElementById('host').style.right = onPage ? '470px' : '0';
  specSection.querySelectorAll('.spec-row').forEach((r) => r.classList.toggle('compact', onPage));
  leadSection.querySelectorAll('.lead-row').forEach((r) => r.classList.toggle('compact', onPage));
  /* on-page mirror: read-only, inherits the host's font/color/background */
  onpage.classList.toggle('is-on', onPage);
  onpage.innerHTML = '';
  if (onPage) {
    onpage.append(el('div', { class: 'op-h', html: `<span>zdtp · type specimen (rendered in the page)</span><span style="margin-left:auto">edit values in the panel</span>` }));
    scale.forEach((t) => onpage.append(el('div', { class: 'op-row', 'data-var': t.v }, [el('span', { class: 'k' }, `${t.id} · ${px(vals[t.v])}px`), el('div', { class: 'op-text', style: `font-size:${px(vals[t.v])}px` }, text)])));
    const base = px(vals['--text-scale-md']);
    leadTier.items.forEach((t) => onpage.append(el('div', { class: 'op-row', 'data-var': t.v, style: 'align-items:start' }, [el('span', { class: 'k' }, `${t.id} · ${vals[t.v]}`), el('div', { class: 'op-lead', style: `font-size:${base}px;line-height:${vals[t.v]};--lh:${(base * vals[t.v]).toFixed(2)}px` }, (text + ' ').repeat(2).trim())])));
  }
}
function sync(full = true) {
  if (textInput.value !== text) textInput.value = text;
  presetsEl.querySelectorAll('span').forEach((s) => s.classList.toggle('on', s.dataset.k === preset && !overridden));
  customTag.textContent = overridden ? '✎ custom · back to preset' : '';
  localStorage.setItem('zdtp-proto-spec-text', text); localStorage.setItem('zdtp-proto-spec-preset', preset); localStorage.setItem('zdtp-proto-spec-overridden', overridden ? '1' : '0');
  render(full);
}
fontInfoUpdate(); sync();
Z.banner(`<b>Idea 04b — A type specimen you feed with your own text.</b> Replaces the in-row "Aa" glyph, which breaks the grid at 60px and says nothing about Japanese. The Font tab becomes a specimen: one row per scale token showing <i>your</i> text at that size (sorted, in the host page's real font), and one paragraph per line-height token with the leading drawn as guide lines. Presets for Latin / 日本語 / mixed, and typing your own text sticks across reloads. <b>Render on page</b> moves the specimen into the host document so you see it on the real background and color, with the panel shrinking to just the inputs. The compare dropdown lazy-loads a Google Font the same way the reference UI does (needs network).`);
</script></body></html>
