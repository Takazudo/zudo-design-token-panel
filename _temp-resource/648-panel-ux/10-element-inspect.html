<!doctype html><html><head><meta charset="utf-8"><title>10 · Inspect an element → its tokens</title>
<link rel="stylesheet" href="shared.css">
<style id="host-tokens">
:root { --spacing-hsp-md:.75rem; --spacing-hsp-lg:1rem; --spacing-vsp-sm:1.25rem; --spacing-vsp-md:1.5rem; --radius-DEFAULT:4px; --radius-lg:8px; --text-scale-sm:1rem; --text-scale-md:1.2rem; --text-scale-xl:3rem; --leading-normal:1.5; --zd-fg:#222222; --zd-surface:#ffffff; --zd-muted:#d8d4cc; --zd-accent:#d69a66; --zd-code-bg:#eee9df; }
.host-body { color: var(--zd-fg); line-height: var(--leading-normal); }
.host-body h1 { font-size: var(--text-scale-xl); color: var(--zd-fg); }
.host-body p { font-size: var(--text-scale-md); line-height: var(--leading-normal); }
.host-body .card { padding: var(--spacing-vsp-sm) var(--spacing-hsp-lg); margin-block: var(--spacing-vsp-md); border-radius: var(--radius-lg); background: var(--zd-surface); border-color: var(--zd-muted); }
.host-body .btn { background: var(--zd-accent); padding: calc(var(--spacing-hsp-md) * .6) var(--spacing-hsp-md); border-radius: var(--radius-DEFAULT); font-size: var(--text-scale-sm); }
.host-body code { background: var(--zd-code-bg); }
</style>
<style>
body.inspecting .host * { cursor: crosshair !important; }
.ol { position:fixed; pointer-events:none; z-index:9; border:2px solid #3b82f6; background:rgb(59 130 246 / .08); display:none; box-sizing:border-box; }
.ol.pinned { border-color:var(--accent); background:transparent; border-style:dashed; }
.ol .tag { position:absolute; left:-2px; top:-20px; background:#3b82f6; color:#fff; font:11px var(--mono); padding:1px 6px; border-radius:3px 3px 0 0; white-space:nowrap; }
.ol.pinned .tag { background:var(--accent); color:#111; }
.crumbs { display:flex; align-items:center; gap:4px; font-family:var(--mono); font-size:12px; margin:-8px 0 -8px; flex-wrap:wrap; }
.crumbs .c { padding:2px 8px; border:1px solid var(--muted-2); border-radius:3px; cursor:pointer; color:var(--muted); }
.crumbs .c.on { border-color:var(--accent); color:#fff; background:var(--surface-2); }
.crumbs .c:hover { color:var(--accent); }
.crumbs .x { margin-left:auto; }
.prop { font-family:var(--mono); font-size:11px; color:var(--accent-hover); width:230px; flex-shrink:0; }
.prop small { color:var(--muted); display:block; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lbl { flex:1; }
.empty { padding:30px; text-align:center; color:var(--muted); font-size:13px; }
.empty .kbd { font-size:12px; }
.icon-btn.arm { color:#3b82f6; background:rgb(59 130 246 / .15); }
</style></head><body>
<script src="shared.js"></script>
<script>
const { el, I, DATA, section, row } = Z;
Z.host();
const ol = el('div', { class: 'ol' }, [el('span', { class: 'tag' })]); document.body.append(ol);
const inspectBtn = el('button', { class: 'icon-btn', title: 'Inspect: click a page element to see the tokens it uses (I)', html: I.crosshair, onclick: () => arm(!armed) });
const ui = Z.shell({ active: 'Inspect', tabs: ['Inspect', 'Palette', 'Color', 'Font', 'Spacing', 'Size'], headerRight: [inspectBtn] });
let armed = false, pinned = null;
const ALL = Object.fromEntries(DATA.tabs.flatMap((t) => (t.tiers || []).flatMap((tier) => tier.items.map((i) => [i.v, { ...i, unit: tier.unit, tier }]))));
const COLORS = { '--zd-fg': '#222222', '--zd-surface': '#ffffff', '--zd-muted': '#d8d4cc', '--zd-accent': '#d69a66', '--zd-code-bg': '#eee9df' };

function arm(on) { armed = on; document.body.classList.toggle('inspecting', on); inspectBtn.classList.toggle('arm', on); if (!on) ol.style.display = pinned ? 'block' : 'none'; }
function label(e) { return e.tagName.toLowerCase() + (e.id ? '#' + e.id : '') + (e.className && typeof e.className === 'string' ? '.' + e.className.trim().split(/\s+/).join('.') : ''); }
function outline(e, isPinned) { const b = e.getBoundingClientRect(); Object.assign(ol.style, { display: 'block', left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px' }); ol.classList.toggle('pinned', isPinned); ol.querySelector('.tag').textContent = label(e); }
document.addEventListener('mousemove', (e) => { if (!armed) return; const t = e.target.closest('.host *'); if (t && t !== document.getElementById('host')) outline(t, false); });
document.addEventListener('click', (e) => { if (!armed) return; const t = e.target.closest('.host *'); if (!t) return; e.preventDefault(); pin(t); arm(false); }, true);
document.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'i' && document.activeElement.tagName !== 'INPUT') arm(!armed); if (e.key === 'Escape') { pinned = null; ol.style.display = 'none'; render(); } });

/* real lookup: which declared rules match the element, and which var() each property reads */
function tokensFor(e) {
  const out = [];
  const sheet = document.getElementById('host-tokens').sheet;
  for (const rule of sheet.cssRules) {
    if (!rule.selectorText || rule.selectorText === ':root') continue;
    let m = false; try { m = e.matches(rule.selectorText); } catch {}
    if (!m) continue;
    /* parse cssText, not rule.style[i]: Chrome serialises `background: var(--x)` as empty longhands, so shorthands would vanish */
    for (const decl of rule.style.cssText.split(';')) {
      const m2 = decl.match(/^\s*([\w-]+)\s*:\s*(.+)$/); if (!m2) continue;
      const [, p, val] = m2; const vars = [...val.matchAll(/var\((--[\w-]+)/g)].map((x) => x[1]);
      vars.forEach((v) => { if (!out.some((o) => o.prop === p && o.v === v)) out.push({ prop: p, v, sel: rule.selectorText, expr: val.trim() }); });
    }
  }
  return out;
}
const INHERIT = new Set(['color', 'font-size', 'line-height', 'font-family']);
function inheritedFor(e) { const out = []; let a = e.parentElement; while (a && a.id !== 'host') { tokensFor(a).filter((t) => INHERIT.has(t.prop)).forEach((t) => out.push({ ...t, from: label(a) })); a = a.parentElement; } return out; }

function tokenRow(t) {
  const info = ALL[t.v]?.d !== undefined ? ALL[t.v] : null; const prop = el('span', { class: 'prop', html: `${t.prop}<small>${t.expr}${t.from ? ' · from ' + t.from : ''}</small>` });
  if (info) return row({ ...info, val: parseFloat(getComputedStyle(document.documentElement).getPropertyValue(t.v)) || info.d }, info.unit, { beforeInput: [prop], onInput: (v) => { const n = parseFloat(v); if (!Number.isNaN(n)) { document.documentElement.style.setProperty(t.v, n + info.unit); pinned && outline(pinned, true); } } });
  const cur = getComputedStyle(document.documentElement).getPropertyValue(t.v).trim() || COLORS[t.v];
  const c = el('input', { type: 'color', value: cur, style: 'width:34px;height:22px;border:1px solid var(--muted);background:none;padding:0;border-radius:3px', oninput: () => document.documentElement.style.setProperty(t.v, c.value) });
  return el('div', { class: 'row', 'data-var': t.v }, [el('div', { class: 'row-head' }, [el('div', { class: 'lbl' }, [el('span', { class: 'var' }, t.v)]), prop, c, el('span', { class: 'eye', html: I.eye })])]);
}
function pin(e) { pinned = e; outline(e, true); render(); }
function render() {
  ui.body.innerHTML = '';
  if (!pinned) { ui.body.append(el('div', { class: 'empty', html: `Press <span class="kbd">I</span> or the crosshair, then click any element on the page.<br><span class="hint">The panel will show only the tokens that element reads, grouped by CSS property.</span>` })); return; }
  const chain = []; let a = pinned; while (a && a.id !== 'host') { chain.unshift(a); a = a.parentElement; }
  ui.body.append(el('div', { class: 'crumbs' }, [...chain.map((n) => el('span', { class: 'c' + (n === pinned ? ' on' : ''), onclick: () => pin(n) }, label(n))), el('span', { class: 'x link', onclick: () => { pinned = null; ol.style.display = 'none'; render(); } }, 'clear ✕')]));
  const own = tokensFor(pinned), inh = inheritedFor(pinned);
  ui.body.append(section(`Tokens read by ${label(pinned)}`, own.length ? el('div', { class: 'grid', style: 'grid-template-columns:1fr' }, own.map(tokenRow)) : el('div', { class: 'hint' }, 'this element has no token-backed declarations of its own — check the ancestors above')));
  if (inh.length) ui.body.append(section('Inherited from ancestors', el('div', { class: 'grid', style: 'grid-template-columns:1fr' }, inh.map(tokenRow))));
}
render();
setTimeout(() => pin(document.getElementById('btn')), 300);
window.addEventListener('scroll', () => pinned && outline(pinned, true), true);
Z.banner(`<b>Idea 10 — Start from the element, not the token list.</b> The eye icon answers "where is this token used?"; nobody answers the reverse: "I'm looking at this button — which tokens shape it?" Arm the crosshair (<kbd>I</kbd>), click anything on the page, and the panel collapses to just that element's tokens grouped by CSS property (padding ← <code>--spacing-hsp-md</code>, background ← <code>--zd-accent</code>…), plus what it inherits from ancestors. Edits are live. This prototype resolves the rules for real, from the stylesheet.`);
</script></body></html>
