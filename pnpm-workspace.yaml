packages:
  - "packages/*"
  - "doc"

# pnpm 11 only reads auth/registry from .npmrc and ignores pnpm.* in package.json.
# Everything else (peer-deps policy, engine strictness, supply-chain delays,
# build-script allowlist) lives here. See https://pnpm.io/settings.
autoInstallPeers: true
strictPeerDependencies: false
preferFrozenLockfile: true
engineStrict: true

# pnpm 11 defaults minimumReleaseAge to 1440 (24h), which would block CI
# `pnpm install --frozen-lockfile` on any dep published in the last day. CI must
# be deterministic, so disable the delay here.
minimumReleaseAge: 0

# pnpm 11 replaces the legacy `onlyBuiltDependencies` list with `allowBuilds`,
# a per-package true/false map. Each entry is a deliberate decision to allow the
# dependency's install/postinstall script. All four are legitimate native-binary
# builds — esbuild ships a Go binary, sharp builds libvips bindings, lefthook +
# workerd ship native binaries — so all approved.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

# Security-driven transitive overrides for `pnpm audit` advisories that have no fix
# reachable by an in-range bump of a direct dep. All are dev/doc-only tooling — none
# ship in the published @takazudo/zdtp package (which publishes only built dist/).
# The `pkg@<vulnerable` selector scopes each override to just the affected versions,
# leaving any already-patched copies untouched.
#   uuid  <11.1.1  — via doc>mermaid (mermaid accepts ^11.1.0 || ^12 || ^13 || ^14)
#   ws    <8.20.1  — via vitest>jsdom>ws and wrangler>miniflare>ws
#   yaml  <2.8.3   — via doc>@astrojs/check>...>yaml-language-server>yaml
overrides:
  "uuid@<11.1.1": ">=11.1.1"
  "ws@<8.20.1": ">=8.20.1"
  "yaml@<2.8.3": ">=2.8.3"
