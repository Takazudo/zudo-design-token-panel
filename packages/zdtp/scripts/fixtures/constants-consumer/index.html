<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Capture the page before the package subpath evaluates. The constants
      // entry must not add panel DOM or stylesheet nodes as an import side
      // effect.
      window.__zdtpConstantsBaseline = {
        globalKeys: Object.getOwnPropertyNames(globalThis),
        panelNodes: document.querySelectorAll('[class*="tokenpanel"], [id*="tokenpanel"]').length,
        styleNodes: document.querySelectorAll('style, link[rel="stylesheet"]').length,
      };
    </script>
  </head>
  <body>
    <script type="module" src="/constants-smoke.js"></script>
  </body>
</html>
